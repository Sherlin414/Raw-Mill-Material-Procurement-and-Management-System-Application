<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Raw Mill — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-950: #050d1a; --navy-900: #0a1628; --navy-800: #0f2040;
      --gold-400: #f0c040; --gold-500: #d4a017; --gold-300: #f7d96a;
      --white: #ffffff; --muted: #8a9bb5; --text: #c8d8f0;
      --border: rgba(212,160,23,0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy-950);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Geometric background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 20%, rgba(30,58,122,0.4) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 85% 80%, rgba(212,160,23,0.1) 0%, transparent 55%);
      pointer-events: none;
    }

    /* Grid lines */
    .grid-lines {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(212,160,23,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212,160,23,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Corner decorations */
    .corner-deco {
      position: fixed;
      width: 180px; height: 180px;
      border: 1px solid rgba(212,160,23,0.15);
      pointer-events: none;
    }
    .corner-deco.tl { top: 24px; left: 24px; border-right: none; border-bottom: none; }
    .corner-deco.br { bottom: 24px; right: 24px; border-left: none; border-top: none; }

    .login-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 420px;
      padding: 16px;
    }

    .login-card {
      background: rgba(10,22,40,0.85);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 44px 40px;
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,160,23,0.08);
      animation: slideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-logo {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: 0 6px 20px rgba(212,160,23,0.35);
      flex-shrink: 0;
    }

    .logo-text h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 700;
      color: var(--white); line-height: 1.1;
    }

    .logo-text span {
      font-size: 0.68rem; font-weight: 500;
      color: var(--gold-400);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .login-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem; font-weight: 600;
      color: var(--white);
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 0.82rem; color: var(--muted);
      margin-bottom: 28px;
    }

    .form-group { margin-bottom: 18px; }

    .form-label {
      display: block;
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--gold-400);
      margin-bottom: 7px;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); font-size: 1rem; pointer-events: none;
    }

    .form-control {
      width: 100%;
      background: rgba(5,13,26,0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px 11px 40px;
      color: var(--white);
      font-size: 0.9rem;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--gold-500);
      box-shadow: 0 0 0 3px rgba(212,160,23,0.12);
    }

    .form-control::placeholder { color: rgba(138,155,181,0.45); }

    .hint {
      font-size: 0.72rem; color: rgba(138,155,181,0.6);
      margin-top: 6px;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      color: var(--navy-950);
      border: none;
      border-radius: 8px;
      font-size: 0.9rem; font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.2s;
      margin-top: 8px;
      box-shadow: 0 4px 20px rgba(212,160,23,0.3);
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(212,160,23,0.45);
    }

    .btn-login:active { transform: translateY(0); }

    .alert-error {
      background: rgba(255,68,68,0.1);
      border: 1px solid rgba(255,68,68,0.3);
      color: #ff8080;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 0.83rem;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 28px 0 16px;
    }

    .creds-hint {
      background: rgba(212,160,23,0.06);
      border: 1px solid rgba(212,160,23,0.15);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .creds-hint strong { color: var(--gold-300); }
  </style>
</head>
<body>
  <div class="grid-lines"></div>
  <div class="corner-deco tl"></div>
  <div class="corner-deco br"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">⚙️</div>
        <div class="logo-text">
          <h1>Raw Mill</h1>
          <span>Management System</span>
        </div>
      </div>

      <h2 class="login-heading">Welcome Back</h2>
      <p class="login-sub">Sign in to access your dashboard</p>

      <div th:if="${error}" class="alert-error">
        <span>⚠</span> <span th:text="${error}">Error</span>
      </div>

      <form method="post" action="/login">
        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" name="username" class="form-control"
                   placeholder="Enter username" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" name="password" class="form-control"
                   placeholder="Enter password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-login">→ Sign In</button>
      </form>

      <div class="divider"></div>
      <div class="creds-hint">
        <strong>Admin:</strong> admin / admin123 &nbsp;|&nbsp; <strong>User:</strong> user / user123
      </div>
    </div>
  </div>
</body>
</html>
